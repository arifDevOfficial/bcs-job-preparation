<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Project</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="card">
    <h1>আমার Demo Project</h1>
    <p><a href="practice.html">📝 MCQ প্র্যাকটিস করুন →</a></p>
    <p id="greeting">স্বাগতম!</p>

    <input type="text" id="nameInput" placeholder="আপনার নাম লিখুন">
    <button id="greetBtn">শুভেচ্ছা জানাও</button>

    <hr>

    <h2>কাউন্টার</h2>
    <div class="counter">
      <button id="minus">−</button>
      <span id="count">0</span>
      <button id="plus">+</button>
    </div>
    <div><button id="resetBtn" class="secondary">রিসেট</button></div>

    <hr>

    <h2>অ্যাকাউন্ট</h2>
    <div id="authForm" hidden>
      <input type="email" id="authEmail" placeholder="ইমেইল" autocomplete="email">
      <input type="password" id="authPassword" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)" autocomplete="current-password">
      <button id="loginBtn">লগইন</button>
      <button id="signupBtn" class="secondary">সাইন আপ</button>
      <div><button id="googleBtn" class="secondary">Sign in with Google</button></div>
    </div>
    <div id="userInfo" hidden>
      <p>ইমেইল: <span id="userEmail"></span></p>
      <p>UUID: <span id="userId"></span></p>
      <button id="logoutBtn" class="secondary">লগআউট</button>
    </div>
    <p id="authStatus" class="status"></p>

    <section id="notesSection" hidden>
      <hr>
      <h2>আমার ব্যক্তিগত নোট</h2>
      <input type="text" id="noteInput" placeholder="একটি নোট লিখুন" maxlength="500">
      <button id="saveNoteBtn">নোট সেভ করো</button>
      <p id="noteStatus" class="status"></p>
      <ul id="notesList" class="messages"></ul>
    </section>

    <hr>

    <h2>মেসেজ (Supabase)</h2>
    <input type="text" id="messageInput" placeholder="একটি মেসেজ লিখুন" maxlength="200">
    <button id="saveMsgBtn">মেসেজ সেভ করো</button>
    <p id="msgStatus" class="status"></p>
    <ul id="messageList" class="messages"></ul>

    <button id="themeBtn" class="secondary">ডার্ক/লাইট মোড</button>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
